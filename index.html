<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIN YEN 品彥 & YU WEN 郁雯 婚禮邀請函</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            gold: '#d4a373',
                            sage: '#8da399',
                            sand: '#fae1dd',
                            cream: '#fcf8f2',
                            dark: '#2c2a29',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400&family=Noto+Serif+TC:wght@200;300;400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Serif TC', serif; color: #2c2a29; background-color: #fcf8f2; }
        .font-serif-english { font-family: 'Cormorant Garamond', serif; }
        .glass-nav { backdrop-filter: blur(16px); background-color: rgba(253, 251, 247, 0.75); }
    </style>
</head>
<body class="overflow-x-hidden">

    <nav class="fixed top-0 left-0 right-0 z-50 glass-nav shadow-sm">
        <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
            <span class="font-serif-english text-lg font-bold tracking-[0.2em] text-morandi-gold">P & Y</span>
            <div class="flex gap-6 text-sm tracking-wider font-medium text-morandi-dark">
                <a href="#about">關於我們</a>
                <a href="#details">婚禮詳情</a>
                <a href="#rsvp">出席回函</a>
            </div>
        </div>
    </nav>

    <header class="relative h-screen w-full flex items-center justify-center overflow-hidden">
        <img src="https://i.postimg.cc/8zfGhW2N/S-261332998.jpg" class="absolute w-full h-full object-cover">
        <div class="absolute inset-0 bg-gradient-to-b from-[#2c2a29]/65 to-[#fcf8f2]"></div>
        <div class="relative z-10 text-center text-white">
            <h1 class="font-serif-english text-3xl md:text-4xl tracking-[0.1em]">PIN YEN 品彥 & YU WEN 郁雯</h1>
        </div>
    </header>

    <section id="rsvp" class="py-24 px-6 max-w-2xl mx-auto">
        <h2 class="text-2xl text-center mb-16 tracking-widest text-morandi-dark">出席回函</h2>
        
        <form action="https://docs.google.com/forms/d/e/1FAIpQLScbuVrtWxaLJY-kxgiMWkET28Q3e0-PlYtfpg_pEuGbdwJv3g/formResponse" method="POST" id="rsvpForm" class="space-y-8 bg-white rounded-3xl p-8 shadow-lg border border-[#e2d4c9]/30">
            
            <div class="space-y-2">
                <label class="text-xs font-semibold">姓名 NAME *</label>
                <input type="text" id="name" name="entry.43388677" required class="w-full bg-morandi-cream/20 border rounded-xl px-4 h-12">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold">電話 PHONE *</label>
                <input type="tel" id="phone" name="entry.1017277948" required class="w-full bg-morandi-cream/20 border rounded-xl px-4 h-12">
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold">與新人的關係 RELATIONSHIP *</label>
                <select id="relationship" name="entry.2141794232" required class="w-full bg-morandi-cream/20 border rounded-xl px-4 h-12">
                    <option value="" disabled selected>請選擇關係</option>
                    <option value="女方家人親戚">女方家人親戚</option>
                    <option value="女方好友">女方好友</option>
                    <option value="男方家人親戚">男方家人親戚</option>
                    <option value="男方好友">男方好友</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold">預定出席人數 BANQUET GUESTS *</label>
                <div class="flex items-center justify-between w-full bg-morandi-cream/20 border rounded-xl px-4 h-12">
                    <span id="attendees-val-display" class="text-xs text-morandi-gold">0 人 (不克出席 敬祝幸福)</span>
                    <div class="flex items-center gap-3">
                        <span id="attendees-num" class="text-sm font-bold">0</span>
                        <div class="flex flex-col">
                            <button type="button" onclick="changeValue('attendees', 1, 0, 10)" class="p-0.5">▲</button>
                            <button type="button" onclick="changeValue('attendees', -1, 0, 10)" class="p-0.5">▼</button>
                        </div>
                    </div>
                </div>
                <input type="hidden" id="attendees" name="entry.1304222397" value="0">
            </div>

            <div id="section-diet" class="space-y-2 hidden">
                <label class="text-xs font-semibold">飲食需求 DIETARY REQUIREMENT *</label>
                <select id="diet" name="entry.2073132008" onchange="handleStepperChange()" class="w-full bg-morandi-cream/20 border rounded-xl px-4 h-12">
                    <option value="葷食">葷食</option>
                    <option value="素食">素食</option>
                </select>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-semibold">給新人的祝福 WISHES</label>
                <textarea id="wishes" name="entry.899551694" rows="3" class="w-full bg-morandi-cream/20 border rounded-xl px-4 py-3"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-morandi-gold text-white py-4 rounded-2xl">傳送回函 SUBMIT</button>
        </form>
    </section>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzYXR0QLMQxpZdmqwHo8fUQC9jD_PZJ2-qlT3SbnKt7rkbffvj9fzdIJ4cOdpO4dv_1/exec";
        const rsvpForm = document.getElementById('rsvpForm');
        
        rsvpForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(rsvpForm);
            const searchParams = new URLSearchParams();
            for (const pair of formData.entries()) { searchParams.append(pair[0], pair[1]); }
            
            const count = parseInt(document.getElementById('attendees').value) || 0;
            searchParams.set('entry.1304222397', count > 0 ? `${count}位` : '不克出席');
            
            fetch(GOOGLE_APPS_SCRIPT_URL, { method: 'POST', body: searchParams.toString(), headers: {'Content-Type': 'application/x-www-form-urlencoded'} })
            .then(() => alert("回函已成功送出！"));
        });

        function changeValue(id, amount, min, max) {
            const input = document.getElementById(id);
            input.value = Math.max(min, Math.min(max, parseInt(input.value) + amount));
            handleStepperChange();
        }

        function handleStepperChange() {
            const count = parseInt(document.getElementById('attendees').value) || 0;
            document.getElementById('attendees-num').innerText = count;
            document.getElementById('attendees-val-display').innerText = count > 0 ? `${count} 人出席` : "0 人 (不克出席 敬祝幸福)";
            document.getElementById('section-diet').classList.toggle('hidden', count <= 0);
        }
    </script>
</body>
</html>
